-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
        additional_dependencies: [tomli]
        exclude: |
            (?x)^(
                docs/spelling_wordlist.txt|
                notebooks/subcom-data-decoding.ipynb
            )
